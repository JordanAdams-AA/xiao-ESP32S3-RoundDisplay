; XIAO ESP32-S3 Round Display watch face
; Build:        pio run
; Flash (USB):  pio run -t upload
; Monitor:      pio device monitor      (only with USB; otherwise use MQTT logs on xiao/log)

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; 8 MB flash, OTA-capable partition table. Chosen from the start so partitions
; never need changing later (which would force another USB flash).
board_build.partitions = default_8MB.csv

; Enable the 8 MB octal PSRAM on the XIAO ESP32-S3 (LVGL uses it for buffers).
board_build.arduino.memory_type = qio_opi

build_flags =
  -D LV_CONF_INCLUDE_SIMPLE          ; make LVGL find include/lv_conf.h
  -I include
  -D BOARD_HAS_PSRAM
  -D ELEGANTOTA_USE_ASYNC_WEBSERVER=0 ; use the built-in sync WebServer (no extra async libs)
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_MODE=1                ; XIAO S3: route Serial to the USB port...
  -D ARDUINO_USB_CDC_ON_BOOT=1         ; ...otherwise Serial goes to UART0 pins and is invisible

lib_deps =
  lvgl/lvgl @ ^8.3.11
  moononournation/GFX Library for Arduino @ 1.4.9   ; pinned: 1.6.x needs Arduino core 3.x, platform ships 2.0.17
  knolleary/PubSubClient @ ^2.8
  ayushsharma82/ElegantOTA @ ^3.1.6
